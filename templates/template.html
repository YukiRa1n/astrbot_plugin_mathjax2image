<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Render</title>

    <!-- CDN 字体定义 -->
    <style>
        /* EB Garamond - 主要衬线字体 */
        @font-face {
            font-family: 'EB Garamond';
            src: url('https://astrbot-plugins.oss-cn-hangzhou.aliyuncs.com/astrbot-plugins/fonts/EBGaramond-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'EB Garamond';
            src: url('https://astrbot-plugins.oss-cn-hangzhou.aliyuncs.com/astrbot-plugins/fonts/EBGaramond-SemiBold.ttf') format('truetype');
            font-weight: 600;
            font-style: normal;
            font-display: swap;
        }
        /* Fira Code - 代码字体 */
        @font-face {
            font-family: 'Fira Code';
            src: url('https://astrbot-plugins.oss-cn-hangzhou.aliyuncs.com/astrbot-plugins/fonts/FiraCode-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        /* Noto Serif SC - 中文衬线字体 */
        @font-face {
            font-family: 'Noto Serif SC';
            src: url('https://astrbot-plugins.oss-cn-hangzhou.aliyuncs.com/astrbot-plugins/fonts/NotoSerifSC-Regular.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
    </style>
    <!-- 真粗体中文与 EB Garamond 斜体（fontsource 按 unicode-range 分片，只下载用到的字） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5.3.0/600.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.3.0/400-italic.css">

    <!-- MathJax 配置 -->
    <script id="MathJax-config">
        window.mathJaxRequired = {{MATH_REQUIRED}};
        const requestedPackages = {{MATH_PACKAGES}};
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: {'[+]': ['ams', 'newcommand', 'boldsymbol', 'mathtools', 'extpfeil', ...requestedPackages]},
                macros: {
                    // 群论/代数
                    Stab: '\\operatorname{Stab}',
                    Aut: '\\operatorname{Aut}',
                    End: '\\operatorname{End}',
                    Hom: '\\operatorname{Hom}',
                    Ker: '\\operatorname{Ker}',
                    Gal: '\\operatorname{Gal}',
                    Orb: '\\operatorname{Orb}',
                    Fix: '\\operatorname{Fix}',
                    Sym: '\\operatorname{Sym}',
                    Alt: '\\operatorname{Alt}',
                    GL: '\\operatorname{GL}',
                    SL: '\\operatorname{SL}',
                    SO: '\\operatorname{SO}',
                    SU: '\\operatorname{SU}',
                    // Tr/tr 为 AMS 内置,不自定义避免覆盖
                    rank: '\\operatorname{rank}',
                    Ann: '\\operatorname{Ann}',
                    Rad: '\\operatorname{Rad}',
                    Nil: '\\operatorname{Nil}',
                    Soc: '\\operatorname{Soc}',
                    char: '\\operatorname{char}',
                    ord: '\\operatorname{ord}',
                    lcm: '\\operatorname{lcm}',
                    // 代数几何
                    Spec: '\\operatorname{Spec}',
                    Proj: '\\operatorname{Proj}',
                    Pic: '\\operatorname{Pic}',
                    Div: '\\operatorname{Div}',
                    Cl: '\\operatorname{Cl}',
                    Jac: '\\operatorname{Jac}',
                    Sing: '\\operatorname{Sing}',
                    // 范畴论
                    Ob: '\\operatorname{Ob}',
                    Mor: '\\operatorname{Mor}',
                    id: '\\operatorname{id}',
                    op: '\\operatorname{op}',
                    colim: '\\operatorname{colim}',
                    // 分析
                    supp: '\\operatorname{supp}',
                    sgn: '\\operatorname{sgn}',
                    Re: '\\operatorname{Re}',
                    Im: '\\operatorname{Im}',
                    Res: '\\operatorname{Res}',
                    // 线性代数
                    diag: '\\operatorname{diag}',
                    span: '\\operatorname{span}',
                    codim: '\\operatorname{codim}',
                    // 常用集合
                    N: '\\mathbb{N}',
                    Z: '\\mathbb{Z}',
                    Q: '\\mathbb{Q}',
                    R: '\\mathbb{R}',
                    C: '\\mathbb{C}',
                    F: '\\mathbb{F}',
                    P: '\\mathbb{P}',
                    A: '\\mathbb{A}',
                    // 常用符号
                    eps: '\\varepsilon',
                    vphi: '\\varphi',
                    coloneqq: '\\mathrel{:=}',
                    eqqcolon: '\\mathrel{=:}',
                    // 加粗数学符号
                    bm: ['\\boldsymbol{#1}', 1],
                    // 扩展箭头（extpfeil 提供 xrightarrow/xleftarrow 等,不自定义避免覆盖）
                    // 微积分(不与内置冲突的)
                    dd: '\\mathrm{d}',
                    dv: ['\\frac{\\mathrm{d}#1}{\\mathrm{d}#2}', 2],
                    pdv: ['\\frac{\\partial #1}{\\partial #2}', 2],
                    divop: '\\nabla \\cdot',
                    // 物理(不与 physics 包冲突的)
                    Laplacian: '\\nabla^2',
                    E: '\\mathbb{E}',
                    Var: '\\operatorname{Var}',
                    Cov: '\\operatorname{Cov}',
                    // 统计/概率(避免与内置 Pr 等冲突,用大写命名)
                    Exp: '\\operatorname{Exp}',
                    Bin: '\\operatorname{Bin}',
                    Unif: '\\operatorname{Unif}',
                    iid: '\\stackrel{\\mathrm{i.i.d.}}{\\sim}',
                    // 线性代数补充(不覆盖内置)
                    adj: '\\operatorname{adj}',
                    nullspace: '\\operatorname{null}',
                    im: '\\operatorname{im}',
                    coker: '\\operatorname{coker}',
                    // 常用集合/符号补充
                    emptyset: '\\varnothing',
                    set: ['\\{ #1 \\}', 1],
                    abs: ['\\lvert #1 \\rvert', 1],
                    norm: ['\\lVert #1 \\rVert', 1],
                    floor: ['\\lfloor #1 \\rfloor', 1],
                    ceil: ['\\lceil #1 \\rceil', 1],
                    avg: '\\operatorname{avg}',
                    // max/min/argmax/argmin 为 TeX 内置,不自定义避免覆盖
                    // 数论/图论(非内置)
                    mod: '\\operatorname{mod}',
                    rem: '\\operatorname{rem}',
                    deg: '\\operatorname{deg}',
                    dist: '\\operatorname{dist}',
                    diam: '\\operatorname{diam}',
                    girth: '\\operatorname{girth}',
                    vol: '\\operatorname{vol}',
                    cut: '\\operatorname{cut}',
                    // 信号处理/分析
                    sinc: '\\operatorname{sinc}',
                    rect: '\\operatorname{rect}',
                    Laplace: '\\mathcal{L}',
                    FT: '\\mathcal{F}',
                    iFT: '\\mathcal{F}^{-1}',
                    ZTransform: '\\mathcal{Z}',
                    // 统计正态分布(避免 N 重复键)
                    Normal: '\\mathcal{N}'
                }
            },
            loader: {
                load: ['[tex]/ams', '[tex]/newcommand', '[tex]/extpfeil', '[tex]/boldsymbol', '[tex]/mathtools', ...requestedPackages.map(name => '[tex]/' + name)],
                paths: {mathjax: 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5'}
            },
            chtml: {
                scale: 1.0
            },
            startup: {
                ready: () => {
                    console.log('MathJax is ready');
                    MathJax.startup.defaultReady();
                    MathJax.startup.promise.then(() => {
                        console.log('MathJax initial typesetting complete');
                        window.mathJaxReady = true;
                    });
                }
            }
        };
        if (requestedPackages.includes('physics')) {
            // Let the package own its optional-argument and starred commands.
            for (const name of ['dd', 'dv', 'pdv', 'abs', 'norm', 'Re', 'Im', 'Res', 'rank', 'op', 'set']) {
                delete MathJax.tex.macros[name];
            }
            MathJax.tex.autoload = {braket: []};
        }
        if (requestedPackages.includes('braket')) delete MathJax.tex.macros.set;
    </script>

    <style>
        :root {
            /* LaTeX 学术论文风格配色 */
            --bg-color: #FDFBF0;        /* 暖白/米色羊皮纸（可被配置覆盖） */
            --body-font-size: 36px;
            --h1-scale: 1.55;
            --h2-scale: 1.25;
            --h3-scale: 1.10;
            --line-height: 1.7;
            --text-color: #2b2b2b;      /* 深炭灰（不用纯黑） */
            --heading-color: #1a1a1a;
            --muted-color: #6b6558;
            --accent-color: #8b3a3a;    /* 暗红强调色（classicthesis 风格） */
            --accent-soft: rgba(139, 58, 58, 0.06);
            --rule-color: rgba(60, 50, 30, 0.22);
            --code-bg: rgba(90, 70, 40, 0.05);
            --code-border: rgba(60, 50, 30, 0.14);
            --gutter-bg: rgba(90, 70, 40, 0.05);
            --line-num-color: #a39e93;

            /* LaTeX 风格字体栈：英文优先 EB Garamond，中文后备 Noto Serif SC */
            --font-main: "EB Garamond", "Noto Serif SC", "Songti SC", serif;

            /* 代码：打字机风格 */
            --font-code: "Fira Mono", "Fira Code", "Courier New", monospace;
        }

        html, body {
            box-sizing: border-box;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: visible;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: var(--line-height);
            padding: 56px 72px;
            font-size: var(--body-font-size);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            color: var(--heading-color);
            line-height: 1.3;
            /* LaTeX 排版：标题字间距收紧 */
            letter-spacing: 0.01em;
            /* LaTeX 排版：标题上方留白要大，体现层级 */
            margin-top: 1.3em;
            margin-bottom: 0.55em;
        }

        .render-content {
            display: flow-root;
        }

        .render-content > :first-child {
            margin-top: 0;
        }

        .render-content > :last-child {
            margin-bottom: 0;
        }

        /* 一级标题：论文标题式粗细双线 */
        h1 {
            font-size: calc(1em * var(--h1-scale));
            padding-bottom: 0.3em;
            border-bottom: 3px double var(--rule-color);
        }

        /* 二级标题：左侧强调色竖条 */
        h2 {
            font-size: calc(1em * var(--h2-scale));
            padding-left: 0.55em;
            border-left: 0.16em solid var(--accent-color);
        }

        h3 {
            font-size: calc(1em * var(--h3-scale));
            color: var(--accent-color);
        }

        h4, h5, h6 {
            font-size: 1em;
        }

        p {
            /* LaTeX 排版：字间距微调，增加空气感 */
            letter-spacing: 0.02em;
            line-height: var(--line-height);
            /* LaTeX 灵魂：两端对齐 */
            text-align: justify;
            text-justify: inter-ideograph;
            /* 段落间距 */
            margin: 0 0 0.9em 0;
        }

        /* 分隔线：两端渐隐 */
        hr {
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--rule-color) 15%, var(--rule-color) 85%, transparent);
            margin: 1.4em 0;
        }

        /* --- 列表样式 --- */
        ul, ol {
            padding-left: 1.6em;
            margin: 0.5em 0 0.9em;
        }

        li {
            margin-bottom: 0.3em;
            padding-left: 0.25em;
        }

        li::marker {
            color: var(--accent-color);
        }

        ol > li::marker {
            font-weight: 600;
        }

        ul {
            list-style-type: disc;
        }

        /* 嵌套列表使用空心圆 / 方块 */
        ul ul {
            list-style-type: circle;
        }

        ul ul ul {
            list-style-type: square;
        }

        li > ul, li > ol {
            margin: 0.3em 0;
        }

        /* --- 引用样式：正体（中文不做伪斜体），强调色竖线 + 浅底 --- */
        blockquote {
            margin: 1em 0;
            padding: 0.55em 1em;
            border-left: 0.14em solid var(--accent-color);
            border-radius: 0 8px 8px 0;
            background: var(--accent-soft);
            color: #3a3631;
        }

        blockquote p {
            margin: 0.3em 0;
        }

        /* --- 代码块样式：左侧行号栏由背景渐变铺满整个高度 --- */
        pre {
            --gutter-width: 3em;
            background:
                linear-gradient(to right,
                    var(--gutter-bg) 0 var(--gutter-width),
                    var(--code-border) var(--gutter-width) calc(var(--gutter-width) + 1px),
                    transparent calc(var(--gutter-width) + 1px)),
                var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: 10px;
            padding: 0.75em 0;
            font-family: var(--font-code);
            font-size: 0.62em;
            margin: 1em 0;
            overflow: hidden;
            /* LaTeX 排版：代码块不两端对齐 */
            text-align: left;
        }

        /* 每行代码容器 */
        .code-line {
            display: flex;
            align-items: flex-start;
        }

        /* 行号 */
        .line-num {
            box-sizing: border-box;
            width: var(--gutter-width);
            text-align: right;
            padding-right: 0.8em;
            color: var(--line-num-color);
            line-height: 1.6;
            user-select: none;
            flex-shrink: 0;
        }

        /* 代码内容 */
        .line-content {
            flex: 1;
            padding-left: 1em;
            padding-right: 1em;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        code {
            font-family: var(--font-code);
            background-color: rgba(90, 70, 40, 0.07);
            color: #7a3328;
            padding: 0.1em 0.35em;
            border-radius: 5px;
            font-size: 0.8em;
        }

        pre code {
            background: none;
            color: inherit;
            padding: 0;
            font-size: 1em;
        }

        /* --- 表格样式：booktabs 三线表 --- */
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
            font-size: 0.9em;
            border-top: 2px solid var(--heading-color);
            border-bottom: 2px solid var(--heading-color);
        }

        th, td {
            padding: 0.45em 0.9em;
            text-align: left;
        }

        thead th {
            font-weight: 600;
            border-bottom: 1px solid var(--heading-color);
        }

        tbody tr:nth-child(even) {
            background-color: rgba(90, 70, 40, 0.035);
        }

        /* --- 链接样式 --- */
        a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid rgba(139, 58, 58, 0.35);
        }

        /* --- 强调样式 --- */
        strong {
            font-weight: 600;
            color: var(--heading-color);
        }

        em {
            font-style: italic;
        }

        /* --- MathJax 公式样式 --- */
        .MathJax {
            font-size: 1.1em !important;
        }

        mjx-container[jax="CHTML"][display="true"] {
            margin: 0.75em 0 !important;
        }

        /* MathJax 中文文本字体对齐正文 */
        mjx-container mjx-mtext,
        mjx-container mjx-utext {
            font-family: var(--font-main) !important;
        }

        /* --- TikZ SVG 样式 --- */
        /* 只针对 TikZ 容器内的 SVG */
        .tikz-diagram {
            text-align: center;
            margin: 24px 0;
            padding: 16px 0;
        }

        .tikz-diagram svg {
            display: block !important;
            position: relative !important;
            margin: 0 auto !important;
            overflow: visible !important;
            /* 放大 TikZ 图形 */
            transform: none !important;
            transform-origin: center center !important;
        }

        /* 不要影响 MathJax 的 SVG */
        mjx-container svg {
            transform: none !important;
        }

        /* --- Mermaid 图表样式 --- */
        pre.mermaid {
            background: transparent !important;
            border: none !important;
            text-align: center;
            margin: 40px 0;
            padding: 20px;
        }

        .mermaid svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <main class="render-content">
    {{CONTENT}}
    </main>

    <!-- 预连接 CDN,减少 MathJax/TikZJax 首字节延迟 -->
    <link rel="preconnect" href="https://astrbot-plugins.oss-cn-hangzhou.aliyuncs.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- MathJax 脚本 (jsdelivr,与 TikZJax 同源更稳;OSS 源曾 ERR_CONNECTION_CLOSED) -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>

    <!-- TikZJax 脚本 (drgrice1 fork via jsdelivr npm)
         原 OSS 源缺 tex.wasm.gz/core.dump.gz/tex_files/,复杂 TikZ 库
         (intersections/patterns/decorations/angles 等)全部渲染失败破图。
         jsdelivr 自动托管 npm 包完整 dist,含全部库文件。 -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@drgrice1/tikzjax@1.0.0-beta24/dist/fonts.css">
    <script src="https://cdn.jsdelivr.net/npm/@drgrice1/tikzjax@1.0.0-beta24/dist/tikzjax.js"></script>

    <!-- Mermaid：优先 unpkg，失败回退 jsdelivr -->
    <script>
        window.mermaidReady = false;
        (function loadMermaid() {
            var sources = [
                'https://unpkg.com/mermaid@10.9.3/dist/mermaid.min.js',
                'https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js'
            ];
            var idx = 0;
            function tryNext() {
                if (!document.querySelector('pre.mermaid')) {
                    window.mermaidReady = true;
                    return;
                }
                if (idx >= sources.length) {
                    console.warn('[MathJax2Image] Mermaid CDN unavailable');
                    window.mermaidError = 'Mermaid CDN unavailable';
                    return;
                }
                var s = document.createElement('script');
                s.src = sources[idx++];
                s.onload = function() {
                    try {
                        mermaid.initialize({
                            startOnLoad: false,
                            theme: 'base',
                            securityLevel: 'strict',
                            themeVariables: {
                                primaryColor: '#FDFBF0',
                                primaryTextColor: '#2c2c2c',
                                primaryBorderColor: '#333',
                                lineColor: '#333',
                                secondaryColor: '#f5f2f0',
                                tertiaryColor: '#FDFBF0',
                                fontFamily: '"EB Garamond", "Noto Serif SC", serif',
                                fontSize: '18px',
                                nodeBorder: '#333',
                                clusterBkg: '#f5f2f0',
                                clusterBorder: '#999',
                                edgeLabelBackground: '#FDFBF0'
                            },
                            flowchart: {
                                curve: 'basis',
                                padding: 20,
                                nodeSpacing: 50,
                                rankSpacing: 50,
                                htmlLabels: true
                            }
                        });
                        var nodes = document.querySelectorAll('pre.mermaid');
                        if (!nodes.length) {
                            window.mermaidReady = true;
                            return;
                        }
                        mermaid.run({ nodes: nodes }).then(function() {
                            window.mermaidReady = true;
                        }).catch(function(err) {
                            console.warn('[MathJax2Image] Mermaid run failed', err);
                            window.mermaidError = String(err);
                        });
                    } catch (e) {
                        console.warn('[MathJax2Image] Mermaid init failed', e);
                        window.mermaidError = String(e);
                    }
                };
                s.onerror = tryNext;
                document.head.appendChild(s);
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', tryNext);
            } else {
                tryNext();
            }
        })();
    </script>

    <!-- Reusable content lifecycle; engines stay loaded between compatible jobs. -->
    <script>
        window.__formatRenderCode = function() {
            document.querySelectorAll('pre code').forEach(function(codeBlock) {
                const pre = codeBlock.parentElement;
                const lines = codeBlock.textContent.split('\n');

                // 移除最后的空行
                if (lines[lines.length - 1] === '') {
                    lines.pop();
                }

                // 清空 pre
                pre.innerHTML = '';

                // 为每行创建独立容器
                lines.forEach(function(lineText, index) {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'code-line';

                    // 行号
                    const lineNum = document.createElement('span');
                    lineNum.className = 'line-num';
                    lineNum.textContent = index + 1;

                    // 代码内容
                    const lineContent = document.createElement('span');
                    lineContent.className = 'line-content';
                    lineContent.textContent = lineText || ' ';

                    lineDiv.appendChild(lineNum);
                    lineDiv.appendChild(lineContent);
                    pre.appendChild(lineDiv);
                });
            });
        };
        document.addEventListener('DOMContentLoaded', window.__formatRenderCode);
        window.__clearRenderContent = function() {
            if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear();
            document.querySelector('main.render-content').replaceChildren();
        };
        window.__replaceRenderContent = async function(content) {
            window.__clearRenderContent();
            window.__tikzFinished = 0;
            window.__tikzFailed = 0;
            window.__svgStats = [];
            window.mermaidError = null;
            window.mermaidReady = false;
            window.mathJaxReady = false;
            const main = document.querySelector('main.render-content');
            main.innerHTML = content;
            window.__formatRenderCode();
            if (window.mathJaxRequired) {
                MathJax.texReset();
                await MathJax.typesetPromise([main]);
            }
            window.mathJaxReady = true;
            const diagrams = main.querySelectorAll('pre.mermaid');
            if (diagrams.length) await mermaid.run({nodes: diagrams});
            window.mermaidReady = true;
        };
    </script>
</body>
</html>
